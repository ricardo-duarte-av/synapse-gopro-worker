# Synapse GoPro Worker configuration.
#
# Phase 1 forwards every request to a Synapse federation reader, so this is a
# transparent insertion: nginx points at the worker, the worker points at the
# Synapse workers it replaced in the routing chain.

server_name: aguiarvieira.pt

listen:
  # Matches the Synapse worker convention of a unix socket in the shared
  # /var/sockets/nginx volume.
  socket: /var/sockets/nginx/av-gopro-worker-1.sock
  # 0666 matches the existing Synapse worker sockets. nginx runs in a separate
  # container as a different uid, so a group-only mode would lock it out.
  socket_mode: "0666"

upstream:
  # The existing Synapse federation readers. Requests are balanced round-robin.
  # These keep running: they are both the current implementation and, later, the
  # reference the native implementation is compared against and the fallback it
  # returns to on error.
  sockets:
    - /var/sockets/nginx/av-inbound-federation-worker-1.sock
    - /var/sockets/nginx/av-inbound-federation-worker-2.sock
  timeout_seconds: 60
  max_idle_conns: 64

metrics:
  addr: ":9200"

# Read-only access to Synapse's PostgreSQL database.
#
# Required as soon as any endpoint leaves proxy mode; ignored (but harmless)
# while everything is proxied. Leave it set so a broken DSN surfaces at startup
# rather than on the first natively-served request.
#
# The unix socket needs no password and no network path. It is already visible
# to the container through the /var/sockets mount that Postgres and Synapse
# share.
#
# Create the role first:  psql -U synapse -d synapse-db -f deploy/readonly-role.sql
database:
  dsn: "host=/var/sockets user=gopro_ro dbname=synapse-db"
  # Bounded well below Synapse's own pool so this worker cannot starve it.
  max_conns: 16
  connect_timeout_seconds: 10

  # In-process caches, bounded in megabytes rather than entry count: a resolved
  # state map ranges from a few kilobytes for a small room to nearly a hundred
  # megabytes for the largest, so an entry bound would not bound memory.
  #
  # Only immutable data is cached, so none of it needs invalidating: a state
  # group's contents are fixed once written, stored event JSON does not change,
  # and an auth chain is a function of immutable events. Membership, server
  # ACLs and erasure are deliberately never cached, because those do change and
  # we have no invalidation signal for them.
  #
  # state_groups is the one that matters. Measured on the largest room here,
  # resolving its 145k-event state took 1.04s cold and 2us warm.
  #
  # Set a field to -1 to disable that cache; 0 takes the default.
  cache:
    state_groups_mb: 512
    events_mb: 128
    event_state_groups_mb: 32
    auth_chains_mb: 64
    # Filtered state, keyed by state group and filter. /event asks only for the
    # history visibility and sometimes one server's memberships; those answers
    # are a few entries each and as immutable as the whole map they come from.
    # Separate from state_groups_mb because the two have opposite shapes: whole
    # maps are enormous and few (24 fill 32MB here), so a /event lookup almost
    # never finds the group it wants -- measured at 0.8%. Filtered answers are
    # tiny and many.
    filtered_state_mb: 64

# How long an answer we are *serving* may take before falling back to Synapse.
#
# Deliberately separate from shadow.timeout_seconds, and much shorter. A shadow
# computation has nobody waiting, so 30s there costs nothing. A served answer
# has a remote server blocked on it, and this whole budget is spent *before*
# the proxy is even asked -- so a timeout costs the client this plus Synapse's
# own time. Measured p99 for /state_ids here is ~200ms, so a long budget
# protects nothing; it only sets how much time can be wasted before giving up.
native_timeout_seconds: 5

endpoints:
  # proxy       - forward to Synapse, return its answer (Phase 1)
  # shadow      - forward to Synapse and serve that, but also compute our own
  #               answer and compare (Phase 2)
  # canary:N    - serve our own answer for N% of requests, falling back to
  #               Synapse for the rest and for anything that goes wrong
  # native      - serve our own answer, falling back to the proxy on error,
  #               and STOP verifying against Synapse
  #
  # Which requests a canary serves is decided by hashing the event ID, not at
  # random, so a retrying server keeps getting the same implementation. An
  # alternating answer would turn any disagreement into a heisenbug.
  #
  # Anything that goes wrong on the native path -- verification, an error, a
  # timeout, a panic -- falls back to Synapse with nothing yet written, so a
  # canary can cost latency but not correctness. Watch
  # gopro_native_fallback_total: a canary where everything falls back is
  # indistinguishable from shadow mode, and should be visible as such.
  #
  # Shadow comparison continues through canary on the share still going to
  # Synapse, so promoting an endpoint does not stop looking for disagreements.
  #
  # Native is where that stops, and it is the only irreversible-feeling step.
  # In canary every answer we serve is replayed to Synapse afterwards and
  # compared, which means Synapse still resolves every state group and runs
  # every recursive state_groups_state walk -- so its database load is
  # unchanged at canary:1 and at canary:100 alike. Removing that load is the
  # point of the project (measured here: 13,530s of state_ids database time in
  # 24h), and native is the mode that finally does it.
  #
  # The consequence to understand before setting it: native is the first mode
  # in which a disagreement would go unnoticed. Nothing compares anything, so
  # the evidence has to be gathered *before* promotion, because afterwards it
  # stops arriving. Drop back to canary:N to start checking again.
  #
  # The rate limiter applies only to the share served natively; traffic going
  # to Synapse is already limited by Synapse.
  # /event applies history-visibility filtering, which the state endpoints do
  # not. It is the only place where a mistake serves private room history to a
  # server that should not see it, so it warrants the longest soak.
  event: proxy
  # /state has no native implementation yet. It receives no traffic on this
  # deployment anyway.
  state: proxy
  # state_ids has a native implementation. Shadow mode still serves Synapse's
  # answer; it only also computes our own and records any disagreement.
  state_ids: proxy
  # get_missing_events reuses /event's visibility filtering and every cache, so
  # it costs almost nothing to add. It is the only POST endpoint here: its
  # answer depends on the request body, which is buffered so verification, the
  # native path and the proxy can each read it.
  #
  # Note that a walk which stops at the limit has no single correct answer --
  # which events survive depends on an iteration order neither side controls --
  # so those comparisons are recorded as
  # shadow_skipped{reason="walk_truncated"} rather than counted either way.
  get_missing_events: proxy

# X-Matrix request verification.
#
# No signing key is configured, and none is needed: verifying an incoming
# request uses the *remote* server's published keys, which are fetched over
# unauthenticated federation. This worker never handles the homeserver's private
# signing key, so do not mount it.
#
# While shadowing, verification runs off the request path and its verdict is
# only compared against Synapse's, never acted on. Watch
# gopro_auth_verdicts_total: "we_accept_synapse_rejects" is the dangerous
# direction and must be zero before any endpoint is served natively.
# Synapse's cache-invalidation stream, over Redis.
#
# This is what makes caching safe. Synapse's data is immutable in the sense that
# a state group's contents never change -- but rooms get purged and events get
# deleted, and a cached entry then describes something that is gone. Without
# this the worker will eventually answer from a cache Synapse has moved past.
#
# It is read-only (SUBSCRIBE only) and needs no credentials beyond reaching
# Redis. Note this is the *stream* replication that every Synapse worker
# consumes -- not the HTTP `replication` listener and instance_map entry, which
# only writer workers need.
#
# The caches are armed only while this subscription is healthy: every connect,
# reconnect, unparseable row and disconnect empties them. Losing Redis therefore
# costs latency, never correctness. Watch gopro_replication_connected.
replication:
  enabled: true
  # Unix socket path, or host:port.
  address: /var/sockets/keydb
  # MUST equal Synapse's server_name: the channel is named after it, and one
  # Redis can carry several homeservers' streams. Subscribing to the wrong
  # channel looks perfectly healthy and never invalidates anything.
  # Defaults to server_name above if omitted.
  channel: example.com
  # password: ""
  # db: 0

auth:
  # Minimum delay before re-querying a server whose key fetch failed, so an
  # unreachable server cannot become a stream of outbound requests.
  key_refetch_minutes: 60
  timeout_seconds: 30

  # Notary servers, queried before falling back to fetching a server's keys
  # from itself. These MUST match Synapse's trusted_key_servers in
  # homeserver.yaml: if the two lists diverge, a server Synapse can verify
  # through a notary would be rejected here, and legitimate federation breaks.
  #
  # Keys are resolved in Synapse's order -- Synapse's own cached keys
  # (server_keys_json, read-only), then these notaries, then the origin server
  # directly. A hostile notary cannot forge keys: the relayed response carries
  # the origin's own signature over its key list, which is verified before the
  # keys are trusted.
  trusted_key_servers:
    - matrix.org
    - maunium.net
    - t2bot.io
    - element.io
    - beeper.com
    - keys.aguiarvieira.pt

# Per-origin federation rate limiting.
#
# APPLIED ONLY WHEN WE ANSWER. While an endpoint is in proxy or shadow mode,
# Synapse answers every request and its own limiter already protects it; adding
# ours in front would put each request through two limiters in series, delaying
# traffic Synapse would have served. These settings take effect the moment an
# endpoint moves to canary or native.
#
# The syntax mirrors Synapse's rc_federation exactly, so this block can be
# copied straight from homeserver.yaml. Copy the ACTIVE settings: if the block
# is commented out there, Synapse is running its defaults, and copying the
# commented values would give us limits Synapse has never applied.
#
# Omit the block entirely to get Synapse's defaults (window_size 1000,
# sleep_limit 10, sleep_delay 500, reject_limit 50, concurrent 3). Individual
# fields default independently, so setting one does not zero the others.
#
#   window_size   milliseconds over which a server's requests are counted
#   sleep_limit   requests in that window before further ones are delayed
#   sleep_delay   how long, in milliseconds, a delayed request waits
#   reject_limit  requests waiting (asleep or queued) before we answer 429
#   concurrent    requests from one server processed at once
rc_federation:
  window_size: 1000
  sleep_limit: 4
  sleep_delay: 1000
  reject_limit: 10
  concurrent: 2

# Tuning for shadow comparison. Only used when an endpoint is past proxy mode.
shadow:
  # Bounds simultaneous native computations, so comparison cannot exhaust the
  # database pool. Comparisons beyond this are dropped, never queued: a stale
  # comparison is worth less than a responsive worker.
  concurrency: 4
  timeout_seconds: 30
  # How much of Synapse's response to keep for comparison. A large room's
  # /state_ids response runs to several megabytes; anything past this is
  # skipped rather than compared wrongly.
  capture_mb: 32

log:
  level: info
  pretty: false

# Where shadow-mode disagreements with Synapse are recorded.
#
# Required as soon as any endpoint moves to shadow or canary mode: a comparison
# whose disagreements go unrecorded is not worth running. A soak lasts weeks, so
# the defaults bound disk use - rotated files are gzipped and capped in number.
#
# Inspect the accumulated evidence at any time with:
#   gopro-worker -diffstats /data/diffs
diff_log:
  # Inside the container. Bind-mounted from ./gopro/diffs so a multi-week soak
  # survives restarts and image upgrades.
  dir: /data/diffs
  # At most max_files * max_file_mb of uncompressed-equivalent history.
  max_file_mb: 64
  max_files: 10
  compress: true
  # Records are dropped rather than blocking a federation request. Any drop is
  # reported by -diffstats, since a lossy log invalidates the promotion gate.
  queue_size: 1024
  # Per-body cap for replay. Set to -1 to omit bodies entirely and keep room
  # content out of the log.
  body_kb: 256
  list_limit: 100
